name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campus_rental_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campus_rental_test
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        # `bash`, not the default shell. GitHub's default for a `run:` block is
        # `bash -e {0}` -- **without `pipefail`** -- so the moment anybody adds
        # a pipe to a step, the step's verdict becomes the last command's.
        # That is catalogue instance eight, and it is the one place in this
        # repository still shaped to allow it. Naming `bash` here gets
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format check)
        run: ruff format --check .

      - name: mypy
        run: mypy .

      # Before every step that imports Django. A field named `property` beside
      # an `@property` raises TypeError while the app registry loads, so every
      # step below would fail with a collection stack trace instead of a
      # message naming the class.
      - name: No model field shadows the property builtin
        run: python tools/check_field_shadowing.py

      # The verified-delete tests need real S3 semantics. InMemoryStorage is a
      # dict whose delete() always works, so they would pass against it whether
      # or not the verification does anything -- the one property the retention
      # job exists to have (docs/OPERATIONS.md).
      #
      # Started as a STEP, not a service container: services cannot set a
      # command, and the minio image needs `server /data`. Without one it
      # starts, prints its usage, and is reported unhealthy.
      #
      # Without this the MinIO-backed tests SKIP, and a silent skip of a
      # compliance test is indistinguishable from a pass -- so a test in that
      # file fails the build when MinIO is unreachable and CI is set.
      - name: Start MinIO and create the buckets
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          curl -sSLo /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /tmp/mc
          for _ in $(seq 1 30); do
            /tmp/mc alias set ci http://localhost:9000 minioadmin minioadmin && break
            sleep 2
          done
          /tmp/mc mb --ignore-existing ci/campusrental-media
          /tmp/mc mb --ignore-existing ci/campusrental-documents
          /tmp/mc anonymous set download ci/campusrental-media
          /tmp/mc anonymous set none ci/campusrental-documents

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: pytest with coverage
        run: pytest --cov-report=term-missing --cov-report=xml

      # The frontend generates its types from this file. If the API changed
      # without regenerating it, the committed types are already stale.
      - name: Check the committed OpenAPI schema is current
        run: |
          python manage.py spectacular --file /tmp/schema.yaml
          if ! diff -q /tmp/schema.yaml ../frontend/src/api/schema.yaml > /dev/null; then
            echo "::error::frontend/src/api/schema.yaml is out of date."
            echo "Regenerate it with:"
            echo "  cd backend && python manage.py spectacular --file ../frontend/src/api/schema.yaml"
            echo "  cd ../frontend && npm run generate:types"
            diff -u ../frontend/src/api/schema.yaml /tmp/schema.yaml | head -60
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        # See the backend job: `bash` buys `-eo pipefail`, the default does not.
        shell: bash
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Types are generated, never hand-written. This fails if the committed
      # schema.d.ts does not match the committed schema.yaml.
      - name: Check generated API types are current
        run: |
          npm run generate:types
          if ! git diff --quiet -- src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is out of date. Run 'npm run generate:types' and commit."
            git --no-pager diff -- src/api/schema.d.ts | head -60
            exit 1
          fi

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm run test:run

      - name: Build
        run: npm run build

      # After the build, because it measures what was actually produced. A
      # budget written in a README and never measured is the same shape as the
      # four bugs in docs/OPERATIONS.md: a check that cannot fail.
      #
      # The user is a student on a mid-range Android on mobile data. Every
      # kilobyte here is time they wait, and on a slow CPU it is parse time as
      # well as download time -- the part a fast laptop never shows you.
      - name: Performance budget
        run: npm run check:budget

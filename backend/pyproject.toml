[project]
name = "campusrentalfinder-backend"
version = "0.1.0"
description = "Backend for CampusRentalFinder, a multi-university student rental platform."
requires-python = ">=3.13"

# --------------------------------------------------------------------------
# Ruff -- replaces black, isort and flake8
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*", ".venv", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument -- common and safe in DRF
    "RUF012",  # ClassVar annotations on Django/DRF class attributes add noise
    "DJ001",   # null=True on CharField -- present in the legacy models, to be
               # resolved by the schema rewrite rather than a blanket edit now
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is the point of a test
    "S105",    # hard-coded test passwords
    "S106",
    "ARG",
]
"*/settings/*" = ["F403", "F405"]  # star imports are the settings-split idiom
"config/settings/test.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "rentals", "reviews", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# mypy -- non-strict; the goal is to catch obvious mistakes, not to gate work
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
follow_imports = "normal"
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
show_error_codes = true
exclude = ['migrations/', '\.venv/']

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Bare --cov: the packages come from [tool.coverage.run] source, so the
    # list lives in exactly one place. It used to be duplicated here as
    # --cov=<name> flags, and the two copies had drifted apart.
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    # No --cov-fail-under here. The floor lives in [tool.coverage.report] and
    # nowhere else: a CLI flag OVERRIDES that setting silently, so the two
    # copies drifted and the flag -- the decorative-looking one -- was the one
    # actually enforcing. Raising the config value alone did nothing, and the
    # build stayed green at the old floor while reporting success.
    #
    # Exactly the shape docs/OPERATIONS.md calls "checks that can pass without
    # checking", in the file that configures the checks.
]
markers = [
    "smoke: minimal checks that the project boots and its plumbing works",
    "architecture: structural rules that must not erode (host classes, tenant scoping)",
    "minio: needs a real S3-compatible store; skipped when MinIO is unreachable",
]
filterwarnings = [
    "error::DeprecationWarning:accounts.*",
    "error::DeprecationWarning:rentals.*",
    "error::DeprecationWarning:reviews.*",
    "error::DeprecationWarning:config.*",
]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------

[tool.coverage.run]
branch = true
# EVERY first-party package, and the only place this list exists.
#
# It was accounts/config/rentals/reviews for six phases, which silently
# excluded properties, tenancies, universities and engagement -- so every
# coverage figure before 2026-08-26 was measured over roughly half the
# codebase, and the number looked healthy throughout. An architecture test now
# asserts this list covers every first-party app.
source = [
    "accounts",
    "config",
    "engagement",
    "properties",
    "reviews",
    "tenancies",
    "tools",
    "universities",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

[tool.coverage.report]
# A ratchet. Raised from 70 to 88 on 2026-08-26, when deleting the draft apps
# and fixing the --cov list moved the measured figure to 88.59%.
#
# Deleting tested code must never let this drop: a floor that falls when code
# is removed is a ratchet running backwards, and it would let a future deletion
# of well-tested code quietly buy slack for poorly-tested code.
fail_under = 89
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

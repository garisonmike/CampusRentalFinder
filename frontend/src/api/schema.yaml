      enum:
      - submitted
      - under_review
      - accepted
      - rejected
      - withdrawn
      - expired
      type: string
      description: |-
        * `submitted` - Submitted
        * `under_review` - Under review
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
        * `expired` - Expired
    CampusDistance:
      type: object
      description: |-
        How far a property is from one campus.

        Both numbers are here on purpose and they are not interchangeable.
      properties:
        campus_name:
          type: string
          readOnly: true
        university_name:
          type: string
          readOnly: true
        straight_line_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          description: STRAIGHT-LINE distance to the campus, in kilometres. Not a
            walking distance and never presented as one -- label it 'as the crow flies'.
            Real walking distance is walking_distance_km, which may be null.
        walking_distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Routed walking distance in kilometres. Null for the same reasons
            as walking_minutes; never substituted with the straight line.
        walking_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: 'Walking time from the routing provider, in minutes. **Legitimately
            null**, and null must render as an em dash rather than a zero or a guess:
            the provider may have no route, be out of quota, or be down. A fabricated
            walking time erodes exactly the trust the platform sells, so the API will
            never substitute the straight-line estimate here.'
        route_provider:
          type: string
          readOnly: true
        routed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - campus_name
      - route_provider
      - routed_at
      - straight_line_km
      - university_name
      - walking_distance_km
      - walking_minutes
    ClaimCreateRequest:

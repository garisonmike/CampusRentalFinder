      description: |-
        The shared shape of all three aggregates.

        A plain Serializer rather than three ModelSerializers: the fields are
        identical by design, and three copies would be three places for the
        contract notes to drift apart.
      properties:
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Mean rating, 1.00-5.00. **null means 'no verified reviews yet'
            and must render as those words.** Never 0, never an empty star row, never
            a placeholder. On a trust platform a fabricated signal is worse than no
            signal, because it is indistinguishable from a real one.
        student_count:
          type: integer
          readOnly: true
          description: 'Distinct students who contributed. **This is the public denominator:
            render it as ''from N students''.** It is deliberately smaller than review_count
            whenever anyone reviewed more than one stay in the same property -- that
            divergence IS the de-duplication, not a bug.'
        review_count:
          type: integer
          readOnly: true
          description: Number of review rows behind the average. **Not the public
            denominator** -- use student_count for that. A student who moved from
            a bedsitter to a one-bedroom in the same block writes two genuine reviews
            and counts as one voice, so these two numbers are SUPPOSED to differ.
        rating_distribution:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
          description: Counts by star, 1-5, every bucket present. Describes RAW reviews,
            not de-duplicated students -- 'how the scores fall' and 'how many people
            spoke' are different questions and both get an honest answer.
        last_review_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        computed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this cache was last rebuilt. Aggregates are stale by design
            between a review landing and the job running; a reconciler finds drift
            rather than the number being recomputed per request. **Null until anything
            has been computed** -- the same moment average_rating is null.
      required:
      - average_rating
      - computed_at
      - last_review_at
      - rating_distribution
      - review_count
      - student_count
    ReasonEnum:
      enum:
      - dates_incorrect
      - never_tenanted
      - duplicate
      type: string
      description: |-
        * `dates_incorrect` - dates_incorrect
        * `never_tenanted` - never_tenanted
        * `duplicate` - duplicate
    Review:
      type: object
      description: |-
        One review, as a reader sees it.

        The reviewer is read through the tenancy and never stored on the review, so
        there is no author field to leak; what is exposed is a display name and a
        verified badge, both derived at render time.
      properties:
        id:
          type: integer
          readOnly: true
        rating:
          type: integer
          readOnly: true
          title: Overall rating
        cleanliness_rating:
          type: integer
          readOnly: true
          nullable: true
          title: Cleanliness
        security_rating:
          type: integer
          readOnly: true
          nullable: true
          title: Security
        water_reliability_rating:
          type: integer
          readOnly: true
          nullable: true
          title: Water reliability
        landlord_rating:
          type: integer
          readOnly: true
          nullable: true
          title: Landlord
        value_rating:
          type: integer
          readOnly: true
          nullable: true
          title: Value for money
        comment:
          type: string
          readOnly: true
        would_recommend:
          type: boolean
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        editable_until:
          type: string
          format: date-time
          readOnly: true
        author_name:
          type: string
          readOnly: true
          description: '''Former student'' for an erased account (ADR-008).'
        is_verified_author:
          type: boolean
          readOnly: true
          description: Whether the author carries the verification badge, read from
            their profile at render time. Absent verification is NOT a discredit --
            most universities do not require it (ADR-003).
        dispute_annotation:
          type: string
          nullable: true
          readOnly: true
          description: Neutral note that the landlord disputed this stay, or null.
            **Render it as a plain factual line. Never as a warning.** Do not grey
            the review out, collapse it, badge it amber, or exclude it from the average.
            A landlord who disputes honestly and one who disputes tactically produce
            the identical annotation, which is exactly why it must not read as a verdict
            -- styling it as one restores the veto ADR-004 removed.
        response:
          allOf:
          - $ref: '#/components/schemas/ReviewResponse'
          readOnly: true
          nullable: true
        unit_label:
          type: string
          readOnly: true
        stay_months:
          type: integer
          readOnly: true
          description: Length of the stay behind this review, in whole months.
      required:
      - author_name
      - cleanliness_rating
      - comment
      - created_at
      - dispute_annotation
      - editable_until
      - id
      - is_verified_author
      - landlord_rating
      - rating
      - response
      - security_rating
      - stay_months
      - unit_label
      - value_rating
      - water_reliability_rating
      - would_recommend
    ReviewResponse:
      type: object
      description: The landlord's single reply.
      properties:
        id:
          type: integer
          readOnly: true
        body:
          type: string
          readOnly: true
          title: Response
        author_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_name
      - body
      - created_at
      - id
    ReviewResponseWriteRequest:
      type: object
      description: The landlord's reply. One per review, ever (ADR-004).
      properties:
        body:
          type: string
          minLength: 1
          title: Response
          maxLength: 1000
      required:
      - body
    ReviewWriteRequest:
      type: object
      description: |-
        Creating or editing a review.

        ``tenancy`` is write-only and validated against the caller: a review is
        only ever about the caller's own stay, and accepting an arbitrary tenancy
        id would let anyone review anyone's.
      properties:
        tenancy:
          type: integer
          writeOnly: true
          description: The stay being reviewed. Must be one of your own, at least
            REVIEW_MINIMUM_STAY_DAYS long, and not already reviewed (ADR-004).
        rating:
          type: integer
          maximum: 5
          minimum: 1
          title: Overall rating
        cleanliness_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Cleanliness
        security_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Security
        water_reliability_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Water reliability
        landlord_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Landlord
        value_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Value for money
        comment:
          type: string
          maxLength: 2000
        would_recommend:
          type: boolean
          nullable: true
      required:
      - rating
      - tenancy
    SavePropertyRequest:
      type: object
      description: |-
        Saving one, by slug.

        By slug rather than id, because the slug is what a client already holds
        from the listing it is looking at.
      properties:
        property_slug:
          type: string
          minLength: 1
          description: Slug of the property to save. Idempotent -- saving twice is
            not an error.
        note:
          type: string
          description: A private reminder to yourself. Never shown to the landlord.
          maxLength: 200
      required:
      - property_slug
    SavedProperty:
      type: object
      description: A saved listing, as it appears in the student's own list.
      properties:
        id:
          type: integer
          readOnly: true
        property_slug:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_town:
          type: string
          readOnly: true
        note:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - property_name
      - property_slug
      - property_town
    SignupPolicyEnum:
      enum:
      - open
      - verification_encouraged
      - verification_required
      type: string
      description: |-
        **Cannot be set to `verification_required` until at least one student here is verified.** A school that sets it before issuing student addresses locks out an entire intake in the week they most need the platform.

        Raising this affects NEW signups only. Existing students keep what they had -- gating reads the policy frozen at each student's own registration (ADR-003).

        * `open` - Open — verification is not mentioned at signup
        * `verification_encouraged` - Encouraged — the student is prompted and can skip
        * `verification_required` - Required — signup completes only for a verified student
    Tenancy:
      type: object
      description: |-
        A tenancy record.

        Read the three currency notes below before rendering anything from this.
      properties:
        id:
          type: integer
          readOnly: true
        unit:
          type: integer
          readOnly: true
        unit_label:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_slug:
          type: string
          readOnly: true
        tenant_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The agreed or actual last day. **null means the tenancy is
            OPEN-ENDED AND STILL RUNNING** -- a real arrangement with no agreed end
            -- and must NOT be rendered as a finished or unknown stay. A stay that
            has ended always has a date here.
        monthly_rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Monthly rent (KES)
        status:
          allOf:
          - $ref: '#/components/schemas/TenancyStatusEnum'
          readOnly: true
          description: |-
            Where the tenancy stands as a RECORD: pending, confirmed, disputed, rejected or withdrawn. **There is no value here meaning 'current' or 'active'.** Whether a confirmed tenancy is running is derived from start_date and end_date, never stored -- a stored currency flag needs a job to stay true, and when the job stops the data lies silently. Filter with ?currency=current|past|upcoming instead.

            * `confirmed` - Confirmed
            * `disputed` - Disputed after confirmation
            * `withdrawn` - Withdrawn by the parties
            * `rejected` - Rejected by an administrator
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: 'DERIVED from start_date and end_date at read time: `current`,
            `past` or `upcoming`. There is no stored field behind this and there must
            not be -- a stored currency flag needs a job to stay true and lies silently
            when the job stops. Filter lists with ?currency= rather than by status.'
          readOnly: true
        confirmation_source:
          allOf:
          - $ref: '#/components/schemas/ConfirmationSourceEnum'
          readOnly: true
        was_disputed:
          type: boolean
          readOnly: true
          description: A dispute occurred, whatever its outcome. A fact, not a display
            decision.
        terminated_early:
          type: boolean
          readOnly: true
          description: The stay ended before its agreed end date. end_date has been
            rewritten to the actual last day and remains authoritative for currency;
            this flag is context, not a currency signal.
        termination_reason:
          type: string
          readOnly: true
        is_reviewable:
          type: boolean
          readOnly: true
          description: Whether this stay is long enough to review and has not been
            reviewed yet. Derived, because the minimum-stay rule compares against
            today (ADR-004).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confirmation_source
      - created_at
      - currency
      - end_date
      - id
      - is_reviewable
      - monthly_rent_kes
      - property_name
      - property_slug
      - start_date
      - status
      - tenant_name
      - terminated_early
      - termination_reason
      - unit
      - unit_label
      - was_disputed
    TenancyClaim:
      type: object
      description: A claim, as the claimant or the landlord sees it.
      properties:
        id:
          type: integer
          readOnly: true
        unit:
          type: integer
          readOnly: true
        unit_label:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        claimant_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        monthly_rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Monthly rent (KES)
        status:
          allOf:
          - $ref: '#/components/schemas/TenancyClaimStatusEnum'
          readOnly: true
          description: |-
            pending | confirmed | disputed | escalated | withdrawn | expired. Silence past `confirmation_deadline` auto-confirms: landlord silence is a signal, not a veto (ADR-004).

            * `pending` - Awaiting confirmation
            * `confirmed` - Confirmed
            * `disputed` - Disputed between the parties
            * `escalated` - Escalated to platform admins
            * `withdrawn` - Withdrawn by the claimant
            * `expired` - Expired
        is_retrospective:
          type: boolean
          readOnly: true
          title: Retrospective
          description: The stay predates the property's presence on the platform.
            **For analytics and the operations queue only -- never for display and
            never for weighting.** A flag that reaches the UI becomes a second class
            of review.
        confirmation_deadline:
          type: string
          format: date-time
          readOnly: true
          description: Silence past this point auto-confirms the claim.
        dispute_reason:
          allOf:
          - $ref: '#/components/schemas/DisputeReasonEnum'
          readOnly: true
          description: |-
            Enumerated, because an untyped dispute can only be routed to a human.

            * `dates_incorrect` - The stay happened; the dates are wrong
            * `never_tenanted` - This person never lived here
            * `duplicate` - Already covered by an existing tenancy
            * `termination_date` - The stay ended; the proposed move-out date is wrong
        dispute_note:
          type: string
          readOnly: true
          description: Additional context. Never a substitute for the enumerated reason.
        proposed_start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        proposed_end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        counter_start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        counter_end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        escalation_reason:
          allOf:
          - $ref: '#/components/schemas/EscalationReasonEnum'
          readOnly: true
          description: |-
            What an administrator has to decide, distinct from why the dispute was raised. counter_unresolved | correction_defeats_review | identity_disputed | duplicate_unmatched.

            * `counter_unresolved` - Which set of dates is right
            * `correction_defeats_review` - Whether a review-defeating correction is honest
            * `identity_disputed` - Whether this person lived here at all
            * `termination_defeats_review` - Whether an early termination that removes a review right is honest
            * `duplicate_unmatched` - Whether an existing tenancy covers this
        escalation_deadline:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The deadline binds the PLATFORM, not the tenant. Past it the
            claim confirms in the tenant's favour (ADR-004).
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - claimant_name
      - confirmation_deadline
      - counter_end_date
      - counter_start_date
      - created_at
      - dispute_note
      - dispute_reason
      - end_date
      - escalation_deadline
      - escalation_reason
      - id
      - is_retrospective
      - monthly_rent_kes
      - property_name
      - proposed_end_date
      - proposed_start_date
      - resolved_at
      - start_date
      - status
      - unit
      - unit_label
    TenancyClaimStatusEnum:
      enum:
      - pending
      - confirmed
      - disputed
      - escalated
      - withdrawn
      - expired
      type: string
      description: |-
        * `pending` - Awaiting confirmation
        * `confirmed` - Confirmed
        * `disputed` - Disputed between the parties
        * `escalated` - Escalated to platform admins
        * `withdrawn` - Withdrawn by the claimant
        * `expired` - Expired
    TenancyStatusEnum:
      enum:
      - confirmed
      - disputed
      - withdrawn
      - rejected
      type: string
      description: |-
        * `confirmed` - Confirmed
        * `disputed` - Disputed after confirmation
        * `withdrawn` - Withdrawn by the parties
        * `rejected` - Rejected by an administrator
    TenantConfig:
      type: object
      description: |-
        The public tenant configuration (ADR-005).

        Deliberately small. It is fetched before first paint on every cold visit,
        so anything not needed to render the shell does not belong here.
      properties:
        subdomain:
          type: string
          readOnly: true
          description: 'The tenant host label: "kyu" serves kyu.example.co.ke.'
        name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
          description: Short form used in the interface, e.g. "KyU".
        logo_url:
          type: string
          format: uri
          readOnly: true
        favicon_url:
          type: string
          format: uri
          readOnly: true
        theme:
          allOf:
          - $ref: '#/components/schemas/TenantTheme'
          readOnly: true
      required:
      - display_name
      - favicon_url
      - logo_url
      - name
      - subdomain
      - theme
    TenantTheme:
      type: object
      description: |-
        The three tokens ADR-005 overrides.

        Foregrounds, `--ring` and the light/dark primary variants are derived
        client-side by WCAG contrast rather than sent, so a tenant cannot configure
        an unreadable button.
      properties:
        primary:
          type: string
          description: HSL triple, e.g. "142 71% 45%".
        secondary:
          type: string
        accent:
          type: string
      required:
      - accent
      - primary
      - secondary
    ToggleActiveResult:
      type: object
      description: A bare confirmation. The message is for a human, not for a branch.
      properties:
        message:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: The state AFTER the toggle, so the caller need not guess it.
      required:
      - is_active
      - message
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    UnitDetail:
      type: object
      description: One unit, with its photos and its property's identity.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
          description: '"B12" for one unit, or "Bedsitters" for a pool of identical
            ones.'
        unit_type:
          allOf:
          - $ref: '#/components/schemas/UnitTypeEnum'
          readOnly: true
        rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Monthly rent (KES)
        deposit_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Deposit (KES)
        furnished:
          allOf:
          - $ref: '#/components/schemas/FurnishedEnum'
          readOnly: true
          title: Furnishing
        bedrooms:
          type: integer
          readOnly: true
          description: 0 for a bedsitter or single room.
        size_sqm:
          type: integer
          readOnly: true
          nullable: true
          title: Size (m²)
          description: Square metres, not feet.
        total_count:
          type: integer
          readOnly: true
          title: Total units
          description: How many identical units exist.
        vacant_count:
          type: integer
          readOnly: true
          title: Vacant units
          description: 'How many are free right now, AS STATED BY THE LANDLORD. Never
            derived and never overwritten: they know about the room let last week
            off-platform and we do not, so their number is usually better than anything
            we could compute.'
        is_available:
          type: boolean
          readOnly: true
          description: Whether any of this unit's rooms are free. Derived from vacant_count
            -- a Unit row may represent a POOL of identical rooms, so 'has a tenancy'
            is not the same question.
        vacancy_freshness:
          allOf:
          - $ref: '#/components/schemas/VacancyFreshnessEnum'
          description: 'How much to trust `vacant_count`: fresh | ageing | stale |
            unknown. **Surface this. Never present a stale count as current.** The
            number is stated by the landlord and never derived -- they know about
            the room let off-platform last week and we do not -- so it is only as
            good as its age. A stale count is still SHOWN, with its age; hiding it
            or zeroing it would replace a number the reader can judge with one they
            cannot. Render the band, do not recompute it from the timestamp: the thresholds
            are server side and a second copy in the client is how they drift.'
          readOnly: true
        vacancy_age_days:
          type: integer
          nullable: true
          readOnly: true
          description: Days since the landlord last stated `vacant_count`, or null
            if they never have. **null is not zero** -- 'nobody has ever said' and
            'said today' are opposite facts. Show alongside `vacancy_freshness`; do
            not derive the band from this.
        available_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        min_stay_months:
          type: integer
          readOnly: true
          title: Minimum stay (months)
          description: One semester. The draft defaulted to a 12-month lease.
        water_included:
          type: boolean
          readOnly: true
        electricity_included:
          type: boolean
          readOnly: true
          description: Token metering is the norm otherwise.
        wifi_included:
          type: boolean
          readOnly: true
        has_private_bathroom:
          type: boolean
          readOnly: true
          title: Private bathroom
          description: Replaces the draft's bathrooms>=1, which made a hostel block
            with shared ablutions impossible to list.
        has_kitchenette:
          type: boolean
          readOnly: true
          title: Kitchenette
        floor:
          type: integer
          readOnly: true
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/UnitPhoto'
          readOnly: true
        property_id:
          type: integer
          readOnly: true
        property_name:
          type: string
          readOnly: true
      required:
      - available_from
      - bedrooms
      - deposit_kes
      - electricity_included
      - floor
      - furnished
      - has_kitchenette
      - has_private_bathroom
      - id
      - is_available
      - label
      - min_stay_months
      - photos
      - property_id
      - property_name
      - rent_kes
      - size_sqm
      - total_count
      - unit_type
      - vacancy_age_days
      - vacancy_freshness
      - vacant_count
      - water_included
      - wifi_included
    UnitPhoto:
      type: object
      description: |-
        One photo, with whichever variants exist.

        Variants are generated by a background job (ADR-007), so a freshly uploaded
        photo has none. `url` always resolves -- to a variant when one exists, to
        the original otherwise -- so a slow queue costs page weight rather than a
        broken image.
      properties:
        id:
          type: integer
          readOnly: true
        caption:
          type: string
          readOnly: true
        sort_order:
          type: integer
          readOnly: true
        is_primary:
          type: boolean
          readOnly: true
          title: Primary photo
        url:
          type: string
          nullable: true
          readOnly: true
          description: Best available rendition. Never null for a ready photo.
        variants:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: Available renditions by name. May be empty while the resize
            job is still queued; fall back to `url`.
        processing_status:
          allOf:
          - $ref: '#/components/schemas/ProcessingStatusEnum'
          readOnly: true
      required:
      - caption
      - id
      - is_primary
      - processing_status
      - sort_order
      - url
      - variants
    UnitSummary:
      type: object
      description: A unit as it appears inside a property listing.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
          description: '"B12" for one unit, or "Bedsitters" for a pool of identical
            ones.'
        unit_type:
          allOf:
          - $ref: '#/components/schemas/UnitTypeEnum'
          readOnly: true
        rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Monthly rent (KES)
        deposit_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Deposit (KES)
        furnished:
          allOf:
          - $ref: '#/components/schemas/FurnishedEnum'
          readOnly: true
          title: Furnishing
        bedrooms:
          type: integer
          readOnly: true
          description: 0 for a bedsitter or single room.
        size_sqm:
          type: integer
          readOnly: true
          nullable: true
          title: Size (m²)
          description: Square metres, not feet.
        total_count:
          type: integer
          readOnly: true
          title: Total units
          description: How many identical units exist.
        vacant_count:
          type: integer
          readOnly: true
          title: Vacant units
          description: 'How many are free right now, AS STATED BY THE LANDLORD. Never
            derived and never overwritten: they know about the room let last week
            off-platform and we do not, so their number is usually better than anything
            we could compute.'
        is_available:
          type: boolean
          readOnly: true
          description: Whether any of this unit's rooms are free. Derived from vacant_count
            -- a Unit row may represent a POOL of identical rooms, so 'has a tenancy'
            is not the same question.
        vacancy_freshness:
          allOf:
          - $ref: '#/components/schemas/VacancyFreshnessEnum'
          description: 'How much to trust `vacant_count`: fresh | ageing | stale |
            unknown. **Surface this. Never present a stale count as current.** The
            number is stated by the landlord and never derived -- they know about
            the room let off-platform last week and we do not -- so it is only as
            good as its age. A stale count is still SHOWN, with its age; hiding it
            or zeroing it would replace a number the reader can judge with one they
            cannot. Render the band, do not recompute it from the timestamp: the thresholds
            are server side and a second copy in the client is how they drift.'
          readOnly: true
        vacancy_age_days:
          type: integer
          nullable: true
          readOnly: true
          description: Days since the landlord last stated `vacant_count`, or null
            if they never have. **null is not zero** -- 'nobody has ever said' and
            'said today' are opposite facts. Show alongside `vacancy_freshness`; do
            not derive the band from this.
        available_from:
          type: string
          format: date
          readOnly: true
          nullable: true
        min_stay_months:
          type: integer
          readOnly: true
          title: Minimum stay (months)
          description: One semester. The draft defaulted to a 12-month lease.
      required:
      - available_from
      - bedrooms
      - deposit_kes
      - furnished
      - id
      - is_available
      - label
      - min_stay_months
      - rent_kes
      - size_sqm
      - total_count
      - unit_type
      - vacancy_age_days
      - vacancy_freshness
      - vacant_count
    UnitTypeEnum:
      enum:
      - bedsitter
      - single_room
      - one_bedroom
      - two_bedroom
      - three_bedroom
      - hostel_block
      - shared_house
      - maisonette
      - other
      type: string
      description: |-
        * `bedsitter` - Bedsitter
        * `single_room` - Single Room
        * `one_bedroom` - One Bedroom
        * `two_bedroom` - Two Bedroom
        * `three_bedroom` - Three Bedroom
        * `hostel_block` - Hostel Block
        * `shared_house` - Shared House
        * `maisonette` - Maisonette
        * `other` - Other
    UnitWriteRequest:
      type: object
      description: |-
        Creating and editing a unit.

        `vacant_count` is **not here and will not be added.** It is stated through
        `PATCH .../vacancy/`, which stamps the time and the author with it. A unit
        edit that could also set the count would let a fresh number keep an old
        date, which is worse than a stale count because the staleness signal would
        then claim currency.

        `available_from` and `is_active` are not here either, for a different
        reason: they are separately delegable. A caretaker may be trusted to say a
        room is off the market without being trusted to change its rent.
      properties:
        label:
          type: string
          minLength: 1
          description: '"B12" for one unit, or "Bedsitters" for a pool of identical
            ones.'
          maxLength: 50
        unit_type:
          $ref: '#/components/schemas/UnitTypeEnum'
        rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Monthly rent (KES)
        deposit_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Deposit (KES)
        water_included:
          type: boolean
        electricity_included:
          type: boolean
          description: Token metering is the norm otherwise.
        wifi_included:
          type: boolean
        furnished:
          allOf:
          - $ref: '#/components/schemas/FurnishedEnum'
          title: Furnishing
        size_sqm:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Size (m²)
          description: Square metres, not feet.
        bedrooms:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0 for a bedsitter or single room.
        has_private_bathroom:
          type: boolean
          title: Private bathroom
          description: Replaces the draft's bathrooms>=1, which made a hostel block
            with shared ablutions impossible to list.
        has_kitchenette:
          type: boolean
          title: Kitchenette
        floor:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
        total_count:
          type: integer
          maximum: 32767
          minimum: 0
          title: Total units
          description: How many identical rooms this row represents. A hostel block
            is one Unit with a total_count of forty, not forty Units.
        min_stay_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Minimum stay (months)
          description: One semester. The draft defaulted to a 12-month lease.
      required:
      - label
      - rent_kes
      - unit_type
    UniversityPolicy:
      type: object
      description: The settings a school administers about itself.
      properties:
        name:
          type: string
          readOnly: true
        display_name:
          type: string
          description: Short form used in the interface, e.g. "KyU".
          maxLength: 50
        signup_policy:
          allOf:
          - $ref: '#/components/schemas/SignupPolicyEnum'
          description: |-
            `open` (verification not mentioned at signup), `verification_encouraged` (prompted, can skip), or `verification_required`.

            **Cannot be set to `verification_required` until at least one student here is verified.** A school that sets it before issuing student addresses locks out an entire intake in the week they most need the platform.

            Raising this affects NEW signups only. Existing students keep what they had -- gating reads the policy frozen at each student's own registration (ADR-003).

            * `open` - Open — verification is not mentioned at signup
            * `verification_encouraged` - Encouraged — the student is prompted and can skip
            * `verification_required` - Required — signup completes only for a verified student
        verification_methods_enabled:
          type: array
          items:
            $ref: '#/components/schemas/VerificationMethodsEnabledEnum'
          description: 'Which paths this school offers. Empty means none, which is
            the default. A school with no document reviewers should not enable `student_id_upload`:
            uploads would arrive into a queue nobody works, and since the retention
            clock starts at upload that means collecting national IDs purely to delete
            them thirty days later.'
        student_email_domains:
          type: array
          items:
            type: string
            maxLength: 255
          description: Domains that prove enrolment, e.g. `["s.kyu.ac.ke"]`. Matched
            EXACTLY on the full domain -- list every subdomain you want accepted,
            because `alumni.kyu.ac.ke` is not `kyu.ac.ke` and the platform will not
            infer enrolment from DNS hierarchy. Blank entries are dropped; whitespace
            and case are normalised.
        verification_grace_period_days:
          type: integer
          maximum: 180
          minimum: 1
          title: Verification grace period (days)
          description: How long a new student may use gated actions before verifying.
            Verification waits on a registry or a human reviewer, neither of which
            the student controls.
        verification_required_to_review:
          type: boolean
        verification_enforced_from:
          type: string
          format: date
          nullable: true
          description: Announce a change before it bites. Until this date the policy
            is treated as `open` for new signups.
        primary_hsl:
          type: string
          title: Primary colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
        secondary_hsl:
          type: string
          title: Secondary colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
        accent_hsl:
          type: string
          title: Accent colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
      required:
      - display_name
      - name
    User:
      type: object
      description: A user's own identity, with their capability set.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        phone_verified:
          type: boolean
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        avatar_url:
          type: string
          format: uri
          maxLength: 200
        is_active:
          type: boolean
          readOnly: true
          title: Active
        date_joined:
          type: string
          format: date-time
          readOnly: true
        capabilities:
          type: object
          description: 'What this user may do right now. **Per-student, not per-university:
            do NOT cache these against the university.** Gating reads the policy frozen
            at each student''s own registration intersected with the live one, so
            two students at the same university can legitimately have different capabilities,
            and a policy change only ever widens what an existing student may do.'
          properties:
            is_student:
              type: boolean
            is_landlord:
              type: boolean
            is_university_staff:
              type: boolean
            is_staff:
              type: boolean
            is_verified_student:
              type: boolean
            verification_status:
              type: string
              nullable: true
            grace_period_ends_at:
              type: string
              nullable: true
            university:
              type: string
              nullable: true
            manages_properties:
              type: array
              items:
                type: integer
          required:
          - grace_period_ends_at
          - is_landlord
          - is_staff
          - is_student
          - is_university_staff
          - is_verified_student
          - manages_properties
          - university
          - verification_status
          readOnly: true
      required:
      - capabilities
      - date_joined
      - email
      - email_verified
      - first_name
      - full_name
      - id
      - is_active
      - last_name
      - phone_verified
    UserLoginRequest:
      type: object
      description: Exchange credentials for a user.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    UserRegistrationRequest:
      type: object
      description: |-
        Create an account.

        No role field. The draft accepted ``user_type`` straight from the request
        body and never validated it, so anyone could register as an administrator
        and the object-permission checks trusted it (docs/AUDIT.md §4.4).

        When the request resolves a tenant, the new user gets a StudentProfile for
        that university — signing up on a university's own subdomain is the
        statement that you are its student. Landlord and staff profiles are granted,
        never self-declared.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
      required:
      - email
      - first_name
      - last_name
      - password
      - password_confirm
    UserStatistics:
      type: object
      description: Counts by capability rather than by a self-declared role string.
      properties:
        total_users:
          type: integer
          readOnly: true
        active_users:
          type: integer
          readOnly: true
        students:
          type: integer
          readOnly: true
        landlords:
          type: integer
          readOnly: true
        university_staff:
          type: integer
          readOnly: true
        platform_staff:
          type: integer
          readOnly: true
        verified_students:
          type: integer
          readOnly: true
      required:
      - active_users
      - landlords
      - platform_staff
      - students
      - total_users
      - university_staff
      - verified_students
    UserUpdateRequest:
      type: object
      description: |-
        The fields a user may change about themselves.

        Deliberately short. Nothing here grants any capability: that is the point
        of ADR-003, and a registration or profile payload must never be able to
        escalate.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        avatar_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - first_name
      - last_name
    VacancyFreshnessEnum:
      enum:
      - fresh
      - ageing
      - stale
      - unknown
      type: string
    VacancyResult:
      type: object
      description: 'What restating a vacancy gives back: the count, and its provenance.'
      properties:
        id:
          type: integer
          readOnly: true
        vacant_count:
          type: integer
          readOnly: true
        total_count:
          type: integer
          readOnly: true
        vacancy_freshness:
          type: string
          readOnly: true
          description: 'How much to trust `vacant_count`: fresh | ageing | stale |
            unknown. **Surface this. Never present a stale count as current.** The
            number is stated by the landlord and never derived -- they know about
            the room let off-platform last week and we do not -- so it is only as
            good as its age. A stale count is still SHOWN, with its age; hiding it
            or zeroing it would replace a number the reader can judge with one they
            cannot. Render the band, do not recompute it from the timestamp: the thresholds
            are server side and a second copy in the client is how they drift.'
        vacancy_age_days:
          type: integer
          readOnly: true
          nullable: true
          description: Days since the landlord last stated `vacant_count`, or null
            if they never have. **null is not zero** -- 'nobody has ever said' and
            'said today' are opposite facts. Show alongside `vacancy_freshness`; do
            not derive the band from this.
        vacant_count_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        vacant_count_updated_by_name:
          type: string
          readOnly: true
          description: Who stated it. A caretaker walking the block and a landlord
            updating from an office are different kinds of evidence, and an operator
            chasing a stale listing needs to know which.
      required:
      - id
      - total_count
      - vacancy_age_days
      - vacancy_freshness
      - vacant_count
      - vacant_count_updated_at
      - vacant_count_updated_by_name
    VerificationDecisionRequest:
      type: object
      description: Approving or rejecting one.
      properties:
        reason:
          type: string
          description: Shown to the student. **Required for a rejection** -- a student
            told 'no' with nothing to act on cannot resubmit successfully.
          maxLength: 255
    VerificationMethodsEnabledEnum:
      enum:
      - email_domain
      - student_id_upload
      type: string
      description: |-
        * `email_domain` - Student email domain
        * `student_id_upload` - Student ID document upload
    VerificationRequest:
      type: object
      description: |-
        A document review request, as the student or the reviewer sees it.

        **No reviewer identity, in either direction.** Not a field, not a name, not
        an id.
      properties:
        id:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        university_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
          description: |-
            pending | approved | rejected.

            * `pending` - Awaiting review
            * `approved` - Approved
            * `rejected` - Rejected
        decision_reason:
          type: string
          readOnly: true
          description: Why the request was approved or rejected, written for the student.
            **The reviewer's identity is deliberately absent from every payload and
            will not be added.** A named individual refusing a student's ID at their
            own institution is a person who can be found in a corridor. A screen that
            wants 'reviewed by' does not get one.
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        attempt:
          type: integer
          readOnly: true
        document_available:
          type: boolean
          readOnly: true
          description: Whether the image still exists. False once retention has deleted
            it -- the DECISION is retained, the image is not (ADR-003).
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt
      - created_at
      - decision_reason
      - document_available
      - id
      - reviewed_at
      - status
      - student_name
      - university_name
    VerificationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Awaiting review
        * `approved` - Approved
        * `rejected` - Rejected
    VerifyUserResult:
      type: object
      description: A bare confirmation. The message is for a human, not for a branch.
      properties:
        message:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
      required:
      - message
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

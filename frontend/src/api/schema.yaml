components:
  schemas:
    AdminRental:
      type: object
      description: |-
        Admin serializer for managing rentals.

        Includes all fields and allows admin operations.
      properties:
        id:
          type: integer
          readOnly: true
        landlord:
          allOf:
          - $ref: '#/components/schemas/Landlord'
          readOnly: true
        images_count:
          type: string
          readOnly: true
        inquiries_count:
          type: string
          readOnly: true
        favorites_count:
          type: string
          readOnly: true
        title:
          type: string
          description: Attractive title for the rental property
          maxLength: 200
        description:
          type: string
          description: Detailed description of the property
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Monthly rent
          description: Monthly rent amount
        security_deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Security deposit amount
        utilities_included:
          type: boolean
          description: Whether utilities (water, electricity, etc.) are included in
            rent
        address:
          type: string
          description: Street address of the property
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          title: State/province
          maxLength: 100
        zip_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
          description: GPS latitude coordinate
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
          description: GPS longitude coordinate
        bedrooms:
          type: integer
          maximum: 20
          minimum: 0
          description: Number of bedrooms
        bathrooms:
          type: integer
          maximum: 20
          minimum: 1
          description: Number of bathrooms
        square_footage:
          type: integer
          maximum: 2147483647
          minimum: 100
          nullable: true
          description: Total area in square feet
        furnishing_status:
          $ref: '#/components/schemas/FurnishingStatusEnum'
        parking_available:
          type: boolean
        parking_spots:
          type: integer
          maximum: 10
          minimum: 0
          nullable: true
        pets_allowed:
          type: boolean
        smoking_allowed:
          type: boolean
        laundry_available:
          type: boolean
        internet_included:
          type: boolean
        gym_access:
          type: boolean
        pool_access:
          type: boolean
        available_from:
          type: string
          format: date
          description: Date when the property becomes available
        lease_duration_min:
          type: integer
          maximum: 60
          minimum: 1
          title: Minimum lease duration (months)
          description: Minimum lease duration in months
        lease_duration_max:
          type: integer
          maximum: 60
          minimum: 1
          nullable: true
          title: Maximum lease duration (months)
          description: Maximum lease duration in months (leave blank for no limit)
        status:
          allOf:
          - $ref: '#/components/schemas/Status124Enum'
          title: Rental status
        is_featured:
          type: boolean
          title: Featured listing
          description: Whether this listing should be featured prominently
        contact_phone:
          type: string
          description: Phone number for inquiries
          maxLength: 17
        contact_email:
          type: string
          format: email
          description: Email for inquiries (defaults to landlord email)
          maxLength: 254
        distance_to_campus:
          type: number
          format: double
          minimum: 0
          nullable: true
          title: Distance to campus (miles)
          description: Distance to main university campus in miles
        shuttle_service:
          type: boolean
          title: Shuttle service to campus
        views_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of times this listing has been viewed
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - available_from
      - bathrooms
      - bedrooms
      - city
      - created_at
      - description
      - favorites_count
      - id
      - images_count
      - inquiries_count

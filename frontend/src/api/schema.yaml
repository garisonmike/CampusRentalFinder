        intended_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Intended stay (months)
        message:
          type: string
        inquiry:
          type: integer
          nullable: true
      required:
      - intended_months
      - move_in_date
      - unit
    ApplicationDecisionRequest:
      type: object
      description: Accepting or rejecting one.
      properties:
        note:
          type: string
          description: Shown to the applicant. A rejection with no reason gives them
            nothing to act on.
          maxLength: 500
        start_date:
          type: string
          format: date
          nullable: true
          description: Agreed start, if different from the applied-for move-in date.
        end_date:
          type: string
          format: date
          nullable: true
          description: Agreed end. **Omit for an open-ended tenancy** -- null means
            no agreed end and currently running, not unknown.
        monthly_rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Agreed rent, if different from the unit's advertised rent.

openapi: 3.0.3
info:
  title: CampusRentalFinder API
  version: 1.0.0
  description: API for the multi-university student rental platform.
paths:
  /api/v1/auth/admin/statistics/:
    get:
      operationId: auth_admin_statistics_retrieve
      description: Counts by capability rather than by a self-declared string.
      summary: User statistics
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatistics'
          description: ''
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: User administration for platform staff.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: auth_admin_users_create
      description: User administration for platform staff.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/auth/admin/users/{id}/:
    get:
      operationId: auth_admin_users_retrieve
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: auth_admin_users_update
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/admin/users/{id}/toggle_active/:
    post:
      operationId: auth_admin_users_toggle_active_create
      description: User administration for platform staff.
      summary: Toggle active
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleActiveResult'
          description: ''
  /api/v1/auth/admin/verify/{user_id}/:
    post:
      operationId: auth_admin_verify_create
      description: |-
        Mark a landlord profile verified.

        Landlord verification is a platform-staff action. Student verification is
        a different flow entirely, run per-university (ADR-003).
      summary: Verify a landlord
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUserResult'
          description: ''
        '404':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token.
      summary: Log out
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Identity and the caller's capability set (ADR-003).
      summary: Current user
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      summary: Change password
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/privacy/erasure/:
    get:
      operationId: auth_privacy_erasure_list
      description: Erasure.
      summary: Your erasure requests and their outcomes
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ErasureRequestResult'
          description: ''
    post:
      operationId: auth_privacy_erasure_create
      description: |-
        Kenya's Data Protection Act §26(e).

        **Recorded as a request with a decision, not an immediate delete.** Erasure is irreversible and cannot run twice, so an accidental one cannot be undone -- and a coerced one is a real risk where a landlord has leverage over a student who reviewed them badly. The record puts a person and a timestamp between the button and the tombstone.

        **Your reviews survive**, with your name replaced by 'Former student'. Deleting them would make erasure a suppression tool: a landlord wanting a bad review gone would need one cooperating student and one support ticket. The right to be forgotten is not a right to unpublish what you said about someone else.

        A landlord with running or upcoming tenancies **cannot complete erasure** -- they are a party to a contract other people are relying on. The response says which, so it can be cleared.
      summary: Request erasure of your personal data
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ErasureRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ErasureRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestResult'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestResult'
          description: ''
  /api/v1/auth/privacy/erasure/{id}/cancel/:
    post:
      operationId: auth_privacy_erasure_cancel_create
      description: |-
        Only during the cooling-off window, and **only by the subject**. Nobody else may cancel it -- not support, not an administrator. The window exists to protect the account owner from a coerced or compromised request, and a third party who could cancel could also be leaned on.

        The account is **not suspended** while it cools off, for the same reason: a suspended account cannot cancel its own request.
      summary: Cancel your erasure request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureRequestResult'
          description: ''
  /api/v1/auth/privacy/export/:
    post:
      operationId: auth_privacy_export_create
      description: |-
        Kenya's Data Protection Act §26(a).

        Requires your password, not just a session: this is everything the platform knows about you in one payload, and a bearer token proves the session rather than the person.

        Two deliberate omissions. **Verification document images are never included** -- returning one would re-expose an identity document to whatever channel this travels over, and the decision is the record. **The reviewer's identity is never included** -- naming the member of staff who refused your ID, in a document handed to you, is how a policy decision becomes a personal one.
      summary: Export everything held about you
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentityConfirmationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: The caller's own identity.
      summary: Get profile
      tags:
      - User Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_profile_update
      description: |-
        PUT is supported as well as PATCH.

        The previous frontend called PUT here and got a 405 on every profile
        save, because the draft implemented only GET and PATCH
        (docs/AUDIT.md §5).
      summary: Replace profile
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: The caller's own identity.
      summary: Update profile
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account and return tokens.
      summary: Register
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        simplejwt's refresh, with our policy attached.

        Subclassed rather than exempted: a refresh endpoint with no throttle is
        the one an attacker holding a stolen refresh token uses fastest, and
        "third party" is not a reason for it to be the only unthrottled write on
        the API.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        simplejwt's verify, with our policy attached.

        Also an oracle: it answers "is this token valid" for anything presented,
        so it is throttled on the same scope as login.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/verification/document/:
    post:
      operationId: auth_verification_document_create
      description: |-
        For schools that issue no student addresses.

        The content type is sniffed from the **leading bytes** -- the declared header and the file extension are both attacker-controlled. JPEG, PNG, WebP and PDF only.

        **EXIF is stripped on ingest.** A photo of a student ID carries the GPS coordinates of wherever it was taken, which is usually where that student lives.

        The image is deleted 7 days after a decision, or 30 days after upload whether or not anyone reviewed it. The decision is retained; the image is not.
      summary: Upload an identity document for review
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
          description: ''
  /api/v1/auth/verification/email/confirm/:
    post:
      operationId: auth_verification_email_confirm_create
      description: |-
        Single use, consumed atomically -- a replayed token loses the race rather than winning it.

        Unknown, expired and already-used tokens return one identical error. The three are different to us and identical to anyone probing.
      summary: Confirm an email verification token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResult'
          description: ''
  /api/v1/auth/verification/email/request/:
    post:
      operationId: auth_verification_email_request_create
      description: |-
        The automated path. No human reviews anything and no reviewer is recorded -- a domain decided it, not a person.

        **The response is deliberately identical whether or not the address is known**, and whether or not you are already verified. Anything else tells an attacker which students exist at a university.

        Rate-limited per user AND per address, independently: per user alone lets several accounts mail-bomb one address, per address alone lets one account grind through a university's namespace.
      summary: Request an email verification link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          description: No response body
  /api/v1/auth/verification/mine/:
    get:
      operationId: auth_verification_mine_list
      description: Outcomes only. The document image is never returned here.
      summary: Your own verification requests
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVerificationRequestList'
          description: ''
  /api/v1/auth/verification/queue/:
    get:
      operationId: auth_verification_queue_list
      description: '**Scoped to the reviewer''s own university.** Staff at one school
        never see another''s requests, and that is the isolation failure with the
        worst consequences in the product: the data behind it is national ID numbers
        belonging to people who never agreed to show them to another institution.'
      summary: The reviewer queue for your university
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - pending
          - rejected
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVerificationRequestList'
          description: ''
  /api/v1/auth/verification/queue/{id}/approve/:
    post:
      operationId: auth_verification_queue_approve_create
      description: The student earns the badge. The reviewer is recorded internally
        and never shown.
      summary: Approve a verification request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
          description: ''
  /api/v1/auth/verification/queue/{id}/document/:
    get:
      operationId: auth_verification_queue_document_retrieve
      description: |-
        Generated per request and **never stored** -- a stored URL is a permanent bearer capability that would outlive both the review and the reviewer's employment. Expiry is minutes.

        **Every call writes a `DocumentAccessLog` row before the URL is returned.** If the log write fails there is no URL: an unlogged read is worse than a blocked one.
      summary: A short-lived signed URL for one document
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
          description: ''
  /api/v1/auth/verification/queue/{id}/reject/:
    post:
      operationId: auth_verification_queue_reject_create
      description: |-
        The reason is shown to the student and is required -- a blurry photo is the common case and they need to know that is what it was.

        **Not terminal.** They may resubmit, up to `VERIFICATION_MAX_SUBMISSIONS`. A dead end here would be an accessibility failure dressed as a security control.
      summary: Reject a verification request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
          description: ''
  /api/v1/engagement/inquiries/:
    get:
      operationId: engagement_inquiries_list
      description: |-
        One endpoint, scoped by relationship rather than by role: a student sees what they sent, a landlord or assigned caretaker sees what was sent about their property. Nobody sees anything else.

        **No contact details appear in either direction.** The conversation stays on-platform so that a resulting stay is one the platform witnessed -- an off-platform arrangement arrives later as a claim, which is a dispute surface and a queue entry the application path never creates (ADR-004 §1.1).
      summary: Inquiries you sent, or that concern property you manage
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - engagement
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiryList'
          description: ''
    post:
      operationId: engagement_inquiries_create
      description: |-
        Rate-limited per user and per unit. An inquiry is an unsolicited message to a stranger, so the limit is part of the feature.

        Phone numbers, email addresses and messaging handles are rejected. Invite them to apply instead.
      summary: Ask about a unit
      tags:
      - engagement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/engagement/inquiries/{id}/close/:
    post:
      operationId: engagement_inquiries_close_create
      description: 'Not a rejection: an inquiry is not an application, and there is
        nothing to reject. Either party may close their own exchange.'
      summary: Close an inquiry without answering
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - engagement
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/engagement/inquiries/{id}/respond/:
    post:
      operationId: engagement_inquiries_respond_create
      description: |-
        The landlord always; an assigned caretaker only with the `respond_inquiries` permission (ADR-003).

        One response, and it closes the exchange. Deliberately not a thread: a thread is a messaging product, and a messaging product is where the conversation stops producing an application.
      summary: Answer an inquiry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - engagement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InquiryResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InquiryResponseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
  /api/v1/engagement/saved/:
    get:
      operationId: engagement_saved_list
      description: Only ever your own. There is no endpoint that lists another user's
        saved properties, and there will not be one -- what somebody is considering
        is not public.
      summary: Your saved properties
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - engagement
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavedPropertyList'
          description: ''
    post:
      operationId: engagement_saved_create
      description: 'Idempotent: saving twice returns the existing row rather than
        erroring. A double tap on a phone is not a conflict.'
      summary: Save a property
      tags:
      - engagement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePropertyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavePropertyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavePropertyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedProperty'
          description: ''
  /api/v1/engagement/saved/{slug}/:
    delete:
      operationId: engagement_saved_destroy
      description: 'Idempotent: unsaving something not saved is a 204, not a 404.'
      summary: Unsave a property
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - engagement
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/properties/:
    get:
      operationId: properties_list
      description: |-
        Properties joined to a campus of the university resolved from the request host (ADR-002). Only published listings appear.

        Ordering by `distance` annotates `nearest_campus_km`, which is a STRAIGHT-LINE figure -- label it as such. Walking figures live on the property detail and are legitimately null.
      summary: Search published properties
      parameters:
      - in: query
        name: available_only
        schema:
          type: boolean
        description: Only properties with a vacant unit
      - in: query
        name: campus
        schema:
          type: number
        description: Campus id
      - in: query
        name: caretaker_on_site
        schema:
          type: boolean
      - in: query
        name: county
        schema:
          type: string
      - in: query
        name: estate
        schema:
          type: string
      - in: query
        name: furnished
        schema:
          type: string
      - in: query
        name: has_backup_power
        schema:
          type: boolean
      - in: query
        name: has_borehole
        schema:
          type: boolean
      - in: query
        name: has_security_guard
        schema:
          type: boolean
      - in: query
        name: has_water_tank
        schema:
          type: boolean
      - in: query
        name: has_wifi
        schema:
          type: boolean
      - in: query
        name: max_distance_km
        schema:
          type: number
          format: double
        description: Direct distance, not walking distance.
      - in: query
        name: max_rent
        schema:
          type: number
          format: double
        description: Maximum rent (KES)
      - in: query
        name: min_rent
        schema:
          type: number
          format: double
        description: Minimum rent (KES)
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -published_at
          - distance
          - rent
        description: '`distance` (nearest campus first), `rent` (cheapest first),
          or `-published_at` (newest first, the default).'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search
      - in: query
        name: town
        schema:
          type: string
      - in: query
        name: unit_type
        schema:
          type: array
          items:
            type: string
            enum:
            - bedsitter
            - hostel_block
            - maisonette
            - one_bedroom
            - other
            - shared_house
            - single_room
            - three_bedroom
            - two_bedroom
        description: |-
          Unit type

          * `bedsitter` - Bedsitter
          * `single_room` - Single Room
          * `one_bedroom` - One Bedroom
          * `two_bedroom` - Two Bedroom
          * `three_bedroom` - Three Bedroom
          * `hostel_block` - Hostel Block
          * `shared_house` - Shared House
          * `maisonette` - Maisonette
          * `other` - Other
        explode: true
        style: form
      tags:
      - properties
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertySummaryList'
          description: ''
  /api/v1/properties/{slug}/:
    get:
      operationId: properties_retrieve
      description: '`straight_line_km` is as the crow flies. `walking_minutes` and
        `walking_distance_km` come from a routing provider and are legitimately null
        -- render an em dash, never a zero and never the straight-line figure (ADR-002).'
      summary: One property, with its units and campus distances
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
  /api/v1/properties/manage/:
    get:
      operationId: properties_manage_list
      description: Owned properties for a landlord, assigned ones for a caretaker,
        **including drafts** -- which is the difference from the public listing endpoint.
        This is where an unpublished property lives until it is pinned.
      summary: Properties you manage
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyDetail'
          description: ''
  /api/v1/properties/manage/{slug}/:
    patch:
      operationId: properties_manage_partial_update
      description: |-
        Landlord only -- editing the building's own details is not in `CaretakerPermission`.

        The slug follows the name only while the property is a draft. Once published the URL is in somebody's saved list and in messages the landlord has already sent, so renaming a live listing changes what it is called and not where it lives.
      summary: Edit a property
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPropertyWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
  /api/v1/properties/manage/{slug}/publication/:
    post:
      operationId: properties_manage_publication_create
      description: |-
        **The coordinates gate runs here.** A property with no latitude and longitude cannot be joined to a campus, and the join is what makes a listing visible to a university (ADR-002) -- so publishing one produces a listing the landlord can see and nobody else can. That failure looks exactly like low demand, which is why this refuses with a named reason instead.

        Landlord only. Publishing puts a building on the internet under the owner's name.
      summary: Publish a property
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
    delete:
      operationId: properties_manage_publication_destroy
      description: Back to draft, never deleted. Tenancies, claims and reviews point
        at this property and are other people's records.
      summary: Take a property off the site
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
  /api/v1/properties/manage/{slug}/units/:
    post:
      operationId: properties_manage_units_create
      description: 'A pool of identical rooms is **one** unit with a `total_count`,
        not forty units. `vacant_count` is not settable here: a new unit starts with
        nobody having stated anything, which is what `vacancy_freshness: unknown`
        means.'
      summary: Add a unit
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnitWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnitWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSummary'
          description: ''
  /api/v1/properties/manage/{slug}/units/{id}/:
    patch:
      operationId: properties_manage_units_partial_update
      description: '**`vacant_count` is refused here**, not ignored. It has one write
        path, which stamps the count with who stated it and when; a unit edit that
        could also set the number would leave a fresh count wearing an old date, and
        the staleness signal would then claim currency.'
      summary: Edit a unit
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUnitWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUnitWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUnitWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSummary'
          description: ''
  /api/v1/properties/manage/{slug}/units/{id}/availability/:
    patch:
      operationId: properties_manage_units_availability_partial_update
      description: |-
        Separately delegable from editing the unit: a caretaker may be trusted to say a room is off the market without being trusted to change its rent.

        `is_active: false` hides a unit without deleting it. Prefer it — tenancy records point at units, and a deleted unit takes somebody's rental history with it.
      summary: Set a unit's availability
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitSummary'
          description: ''
  /api/v1/properties/manage/{slug}/units/{id}/photos/:
    get:
      operationId: properties_manage_units_photos_list
      description: 'Includes `processing_status` and `processing_error`, which the
        public serializer does not: a landlord whose photo failed to resize is owed
        the reason, and a student is not.'
      summary: Photos on a unit, as its manager sees them
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
          description: ''
    post:
      operationId: properties_manage_units_photos_create
      description: |-
        Stored immediately and resized in the background (ADR-007), so a fresh photo has no variants and the API serves the original. The first photo on a unit becomes its cover.

        JPEG, PNG or WebP, checked by content type rather than by filename -- an extension is whatever the client typed, and the resize step is a decoder pointed at whatever arrives.
      summary: Upload a photo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/v1/properties/manage/{slug}/units/{id}/photos/{photo_id}/:
    delete:
      operationId: properties_manage_units_photos_destroy
      description: |-
        Removes the row. The stored object is left in the bucket -- a delete that also removed the file could not be undone by an operator, and a landlord who deleted the wrong photo of a room they no longer have access to has lost it for good.

        Deleting the cover promotes the next photo.
      summary: Delete a photo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/properties/manage/{slug}/units/{id}/photos/order/:
    put:
      operationId: properties_manage_units_photos_order_update
      description: |-
        Send **every** photo id on the unit, in the order you want. A partial list is refused: it means the page you are ordering from is stale, and applying it would silently drop the photos it does not mention.

        The first becomes the cover.
      summary: Reorder a unit's photos
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoOrderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
          description: ''
  /api/v1/properties/manage/{slug}/units/{id}/vacancy/:
    patch:
      operationId: properties_manage_units_vacancy_partial_update
      description: |-
        **The only way to write `vacant_count`.** Every write stamps the time and the author together, and the listing shows that stamp beside the number -- which is what lets a student tell 'six free, confirmed yesterday' from 'six free, nobody has said since March'.

        The count is never derived from our tenancy records and never overwritten by them: you know about the room let off-platform last week and we do not.

        Delegable to a caretaker as `manage_vacancy`, separately from everything else, because this is the number people travel on.
      summary: State how many rooms are free
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVacancyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVacancyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVacancyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyResult'
          description: ''
  /api/v1/properties/manage/new/:
    post:
      operationId: properties_manage_new_create
      description: |-
        Always created as a **draft**, whatever the payload says. Publishing has a gate -- a property with no coordinates cannot join a campus and would be invisible to every student -- so creating and publishing are two steps, one of which can refuse.

        Landlord only. Creating a building is not delegable.
      summary: Create a property
      tags:
      - properties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PropertyWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
  /api/v1/properties/units/{id}/:
    get:
      operationId: properties_units_retrieve
      description: '`vacant_count` is authoritative for availability, not the absence
        of a tenancy: a Unit row may represent a POOL of identical rooms (forty bedsitters
        as one row), so several students hold the same unit concurrently and that
        is correct.'
      summary: One unit, with its photos
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - properties
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitDetail'
          description: ''
  /api/v1/reviews/:
    post:
      operationId: reviews_create
      description: Requires a confirmed tenancy of your own, at least REVIEW_MINIMUM_STAY_DAYS
        long and not already reviewed. A week in a room tells you about the viewing;
        the water going off every third Thursday takes a month to notice (ADR-004).
      summary: Write a review
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/v1/reviews/{id}/:
    patch:
      operationId: reviews_partial_update
      description: Editable for REVIEW_EDIT_WINDOW_DAYS after posting, then frozen.
        A review that can be rewritten for ever can be rewritten under pressure, and
        the pressure would come from the party with more of it (ADR-004).
      summary: Edit your review, inside its window
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReviewWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReviewWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReviewWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/v1/reviews/{id}/response/:
    post:
      operationId: reviews_response_create
      description: 'The landlord''s single public reply. Never a caretaker''s: a caretaker
        can confirm that somebody lived somewhere, but speaking for the business in
        public is the owner''s own act (ADR-003).'
      summary: Respond to a review, once
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewResponseWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewResponseWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewResponseWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
          description: ''
  /api/v1/reviews/manage/:
    get:
      operationId: reviews_manage_list
      description: |-
        Every published review across the properties you own or are assigned to, newest first.

        **Filter with `?answered=false` to find the actionable ones.** A landlord with nine properties has one question worth asking of this list -- what has not been replied to -- and making them page through answered reviews to find it is how a reply surface goes unused.

        Caretakers may read this. Only the owner may reply: a caretaker can confirm somebody lived somewhere, but speaking for the business in public is the owner's own act (ADR-003), and the reply endpoint enforces that rather than trusting a client to hide a button.

        `dispute_annotation` follows the same rule here as everywhere else. **Render it as a plain factual line, in the landlord's own view too.** A landlord seeing their disputed reviews greyed out in their portal learns that disputing is how you make a review look less credible, which is the veto ADR-004 removed.
      summary: Reviews of properties you manage
      parameters:
      - in: query
        name: answered
        schema:
          type: boolean
        description: '`false` for reviews with no response yet -- the ones worth your
          time. `true` for the rest. Omit for all.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - reviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
  /api/v1/reviews/properties/{slug}/:
    get:
      operationId: reviews_properties_list
      description: '`dispute_annotation` is neutral and must be rendered as a plain
        factual line. Never grey the review out, collapse it, badge it amber or exclude
        it from the average -- styling it as a warning restores the veto ADR-004 removed.'
      summary: Reviews of one property
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
  /api/v1/reviews/properties/{slug}/rating/:
    get:
      operationId: reviews_properties_rating_retrieve
      description: |-
        `average_rating: null` means **no verified reviews yet** and must render as those words -- never 0, never an empty star row.

        `student_count` is the public denominator ('from N students'). It is deliberately smaller than `review_count` whenever anyone reviewed more than one stay in the same property; that divergence IS the de-duplication (ADR-004).

        A property with no reviews of its own may show `landlord` as a secondary signal, **labelled as being about the landlord**, never about this property.
      summary: Rating for one property
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyRating'
          description: ''
  /api/v1/reviews/units/{id}/rating/:
    get:
      operationId: reviews_units_rating_retrieve
      description: 'Unit ratings are NOT de-duplicated per student, unlike property
        ratings: one stay is one review, and a tenant cannot hold overlapping stays
        in the same unit, so there is nothing to collapse. `student_count` and `review_count`
        differ here only when someone genuinely returned to the same room years later.'
      summary: Rating for one unit
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingAggregate'
          description: ''
  /api/v1/tenancies/:
    get:
      operationId: tenancies_list
      description: |-
        **Currency is derived, not stored.** There is no status value meaning 'current' -- filter with `?currency=current|past|upcoming`, which is computed from start_date and end_date at query time.

        A null `end_date` means the tenancy is OPEN-ENDED AND STILL RUNNING, not that it ended at an unknown time. Most Kenyan student lets are month-to-month with no written end, so this is the common case rather than an edge one.
      summary: Your tenancies
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - current
          - past
          - upcoming
        description: Derived from the dates. Omit for all live tenancies.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenancyList'
          description: ''
  /api/v1/tenancies/applications/:
    get:
      operationId: tenancies_applications_list
      description: 'Scoped by relationship: an applicant sees their own, a landlord
        or assigned caretaker sees those for their property.'
      summary: Applications you sent, or for property you manage
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
    post:
      operationId: tenancies_applications_create
      description: The on-platform path. When this is accepted a confirmed tenancy
        is created **directly** -- no claim, no confirmation window, no dispute surface.
        That is ADR-004's primary control on dispute volume, and it is why applying
        is worth preferring over arranging off-platform and claiming later.
      summary: Apply for a unit
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/tenancies/applications/{id}/accept/:
    post:
      operationId: tenancies_applications_accept_create
      description: |-
        Creates a confirmed tenancy in the same transaction. An accepted application with no tenancy is a stay the platform witnessed and cannot vouch for -- exactly the gap the tenancy record closes.

        Omit `end_date` for an open-ended tenancy. Null there means no agreed end and currently running.
      summary: Accept an application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenancy'
          description: ''
  /api/v1/tenancies/applications/{id}/reject/:
    post:
      operationId: tenancies_applications_reject_create
      description: Creates nothing. The reason is shown to the applicant.
      summary: Reject an application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationDecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/tenancies/applications/{id}/withdraw/:
    post:
      operationId: tenancies_applications_withdraw_create
      description: The applicant's own act, so no decider is recorded -- withdrawing
        is not a decision made about them.
      summary: Withdraw your own application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/tenancies/claims/:
    get:
      operationId: tenancies_claims_list
      description: Claims the caller is a party to.
      summary: Claims you raised, or that concern property you manage
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenancyClaimList'
          description: ''
    post:
      operationId: tenancies_claims_create
      description: |-
        For off-platform arrangements and pre-platform history **only**. An accepted application creates a confirmed tenancy directly and must never come through here.

        The landlord has `TENANCY_CONFIRMATION_WINDOW_DAYS` to confirm or dispute. **Silence auto-confirms**: landlord silence is a signal, not a veto (ADR-004).

        Rate-limited per user over a rolling 30 days, and refused with an explanation rather than silently dropped -- a genuine flood needs somewhere to go.
      summary: Claim a stay the platform did not witness
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
  /api/v1/tenancies/claims/{id}/accept-correction/:
    post:
      operationId: tenancies_claims_accept_correction_create
      description: |-
        Normally settles the dispute with no administrator involved.

        **Unless the correction would make the stay too short to review.** Then it escalates as `correction_defeats_review` even though you agreed, because a tenant who misremembers by a week -- or who simply wants the argument over -- may not realise that what they accepted also deletes their review. Your acceptance is recorded as evidence for the administrator, who will usually find the correction honest (ADR-004 §2b).
      summary: Accept the disputer's corrected dates
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenancy'
          description: ''
  /api/v1/tenancies/claims/{id}/accept-counter/:
    post:
      operationId: tenancies_claims_accept_counter_create
      description: 'The same review-defeating guard applies: a correction laundered
        through a counter is still a correction.'
      summary: Accept the tenant's counter-dates
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenancy'
          description: ''
  /api/v1/tenancies/claims/{id}/confirm/:
    post:
      operationId: tenancies_claims_confirm_create
      description: The landlord or an assigned caretaker agreeing the stay happened.
        Creates the tenancy.
      summary: Confirm a claim
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenancy'
          description: ''
  /api/v1/tenancies/claims/{id}/counter/:
    post:
      operationId: tenancies_claims_counter_create
      description: Once, because an unbounded exchange between two people who disagree
        is an indefinite block by another name.
      summary: Counter the correction, once
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
  /api/v1/tenancies/claims/{id}/dispute/:
    post:
      operationId: tenancies_claims_dispute_create
      description: |-
        The reason is enumerated because an untyped dispute cannot be routed and can therefore only go to a human -- and most disputes must not reach one, or the queue is unbounded (ADR-004 §2).

        `dates_incorrect` stays between the parties. `duplicate` auto-resolves against the same predicate the exclusion constraint enforces. `never_tenanted` goes straight to an administrator, because an identity question is not something the parties can settle.

        **A correction that would drop the stay below the review minimum cannot auto-resolve at all**, even with the tenant's acceptance.
      summary: Dispute a claim, with a typed reason
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
  /api/v1/tenancies/claims/{id}/reject-counter/:
    post:
      operationId: tenancies_claims_reject_counter_create
      description: Two parties, no agreement. Escalates as `counter_unresolved`.
      summary: Reject the counter
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
  /api/v1/tenancies/disputes/:
    get:
      operationId: tenancies_disputes_list
      description: |-
        Escalated claims awaiting a decision, oldest first.

        **Filter by `escalation_reason`.** Working a mixed queue oldest-first is right; working it without knowing which kind of question each item is means gathering the wrong evidence first. An identity dispute and a fortnight's disagreement about dates need completely different evidence (ADR-004 §2a).

        `dispute_reason` is what the disputer claimed and is never rewritten; `escalation_reason` is what you have to decide.
      summary: The dispute queue
      parameters:
      - in: query
        name: escalation_reason
        schema:
          type: string
          enum:
          - correction_defeats_review
          - counter_unresolved
          - duplicate_unmatched
          - identity_disputed
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenancyClaimList'
          description: ''
  /api/v1/tenancies/disputes/{id}/resolve/:
    post:
      operationId: tenancies_disputes_resolve_create
      description: Upholding it confirms the claim as an administrator decision.
      summary: Decide an escalated claim
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - tenancies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyClaim'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenancy'
          description: ''
  /api/v1/tenant/config/:
    get:
      operationId: tenant_config_retrieve
      description: 'Branding and identity for the university serving this host. Unauthenticated:
        the login page itself has to be branded, and it renders before any token exists.
        Returns 404 on a host that resolves no tenant, so the client falls back to
        its neutral palette.'
      summary: Tenant configuration
      tags:
      - Tenant
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'
          description: ''
        '404':
          description: No response body
  /api/v1/tenant/policy/:
    get:
      operationId: tenant_policy_retrieve
      description: University staff only, and only for their own institution.
      summary: Your university's policy and theme
      tags:
      - tenant
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityPolicy'
          description: ''
    patch:
      operationId: tenant_policy_partial_update
      description: '**The lockout guard runs here.** Setting `signup_policy` to `verification_required`
        is refused until at least one student at this university is verified -- the
        guard checks an outcome, not configuration, because ''are any methods enabled?''
        returns yes in exactly the case that locks out an intake (ADR-003).'
      summary: Update your university's policy or theme
      tags:
      - tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUniversityPolicyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUniversityPolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUniversityPolicyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityPolicy'
          description: ''
  /health/live/:
    get:
      operationId: health_live_retrieve
      description: Returns 200 whenever the process can serve a request.
      summary: Liveness probe
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Returns 200 when the database and Redis are both reachable, 503
        otherwise.
      summary: Readiness probe
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AdminUser:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
        is_staff:
          type: boolean
          readOnly: true
          title: Platform staff
          description: The only meaning of 'platform administrator'. Not settable
            via the API.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        capabilities:
          type: object
          description: 'What this user may do right now. **Per-student, not per-university:
            do NOT cache these against the university.** Gating reads the policy frozen
            at each student''s own registration intersected with the live one, so
            two students at the same university can legitimately have different capabilities,
            and a policy change only ever widens what an existing student may do.'
          properties:
            is_student:
              type: boolean
            is_landlord:
              type: boolean
            is_university_staff:
              type: boolean
            is_staff:
              type: boolean
            is_verified_student:
              type: boolean
            verification_status:
              type: string
              nullable: true
            grace_period_ends_at:
              type: string
              nullable: true
            university:
              type: string
              nullable: true
            manages_properties:
              type: array
              items:
                type: integer
          required:
          - grace_period_ends_at
          - is_landlord
          - is_staff
          - is_student
          - is_university_staff
          - is_verified_student
          - manages_properties
          - university
          - verification_status
          readOnly: true
      required:
      - capabilities
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_staff
      - last_name
    AdminUserRequest:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
      required:
      - first_name
      - last_name
    Application:
      type: object
      description: An application, as either party sees it.
      properties:
        id:
          type: integer
          readOnly: true
        unit:
          type: integer
        unit_label:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_slug:
          type: string
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        move_in_date:
          type: string
          format: date
          title: Requested move-in date
        intended_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Intended stay (months)
        message:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          description: |-
            submitted | under_review | accepted | rejected | withdrawn | expired. An accepted application creates a confirmed tenancy directly -- no claim, no confirmation window, no dispute surface (ADR-004 §1.1).

            * `submitted` - Submitted
            * `under_review` - Under review
            * `accepted` - Accepted
            * `rejected` - Rejected
            * `withdrawn` - Withdrawn
            * `expired` - Expired
        decision_note:
          type: string
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true

      - never_tenanted
      - duplicate
      - termination_date
      type: string
      description: |-
        * `dates_incorrect` - The stay happened; the dates are wrong
        * `never_tenanted` - This person never lived here
        * `duplicate` - Already covered by an existing tenancy
        * `termination_date` - The stay ended; the proposed move-out date is wrong
    DisputeRequest:
      type: object
      description: Disputing a claim, with a typed reason.
      properties:
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          description: |-
            Enumerated, because an untyped dispute cannot be routed and can therefore only go to a human. Free text belongs in `note` as additional context, never as a substitute.

            * `dates_incorrect` - dates_incorrect
            * `never_tenanted` - never_tenanted
            * `duplicate` - duplicate
        note:
          type: string
          maxLength: 1000
        proposed_start_date:
          type: string
          format: date
          nullable: true
          description: 'Required for `dates_incorrect`: the dates you say are right.'
        proposed_end_date:
          type: string
          format: date
          nullable: true
      required:
      - reason
    EmailVerificationConfirmRequest:
      type: object
      description: Consuming the link.
      properties:
        token:
          type: string
          minLength: 1
          description: The token from the emailed link. Single use, and expires.
      required:
      - token
    EmailVerificationRequestRequest:
      type: object
      description: Asking for a verification link.
      properties:
        student_email:
          type: string
          format: email
          minLength: 1
          description: An address at one of your university's configured student domains.
            Matched EXACTLY on the full domain -- a lookalike like `evil-kyu.ac.ke`
            is refused.
      required:
      - student_email
    EmailVerificationResult:
      type: object
      description: |-
        What confirming a token tells the caller about themselves.

        Declared so the client's type is generated rather than hand-written. An
        undeclared response leaves the schema saying "no response body", and the
        frontend then owns a private copy of the contract -- which is how
        `Paginated<T>` drifted three fields behind the API without anything
        noticing.
      properties:
        verification_status:
          type: string
          readOnly: true
        verification_method:
          type: string
          readOnly: true
          nullable: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - verification_method
      - verification_status
      - verified_at
    ErasureRequestRequest:
      type: object
      description: Asking to be erased.
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Your current password. Required to confirm it is you.
        reason:
          type: string
          description: Optional. Recorded with the request; not required to grant
            it.
          maxLength: 500
        confirm_understanding:
          type: boolean
          description: You must pass true. Erasure is irreversible, and your reviews
            SURVIVE with your name replaced by a tombstone -- deleting them would
            let anyone remove criticism by deleting an account (ADR-008).
      required:
      - confirm_understanding
      - password
    ErasureRequestResult:
      type: object
      description: What the subject is told.
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ErasureRequestResultStatusEnum'
          readOnly: true
        blockers:
          readOnly: true
        retained:
          type: array
          items:
            type: string
          readOnly: true
          description: What survives erasure, and why. Shown before and after.
        requested_at:
          type: string
          format: date-time
          readOnly: true
        executes_after:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - blockers
      - cancelled_at
      - completed_at
      - executes_after
      - id
      - requested_at
      - retained
      - status
    ErasureRequestResultStatusEnum:
      enum:
      - cooling_off
      - completed
      - blocked
      - cancelled
      type: string
      description: |-
        * `cooling_off` - Cooling off
        * `completed` - Completed
        * `blocked` - Blocked
        * `cancelled` - Cancelled by the subject
    EscalationReasonEnum:
      enum:
      - counter_unresolved
      - correction_defeats_review
      - identity_disputed
      - termination_defeats_review
      - duplicate_unmatched
      type: string
      description: |-
        * `counter_unresolved` - Which set of dates is right
        * `correction_defeats_review` - Whether a review-defeating correction is honest
        * `identity_disputed` - Whether this person lived here at all
        * `termination_defeats_review` - Whether an early termination that removes a review right is honest
        * `duplicate_unmatched` - Whether an existing tenancy covers this
    FurnishedEnum:
      enum:
      - unfurnished
      - semi_furnished
      - furnished
      type: string
      description: |-
        * `unfurnished` - Unfurnished
        * `semi_furnished` - Semi Furnished
        * `furnished` - Furnished
    IdentityConfirmationRequest:
      type: object
      description: |-
        Re-authentication before anything irreversible or wholesale.

        A bearer token proves the session; it does not prove the person is still
        at the keyboard. For an export -- everything we hold about somebody, in one
        payload -- and for erasure, that difference matters.
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Your current password. Required to confirm it is you.
      required:
      - password
    Inquiry:
      type: object
      description: |-
        An inquiry, as either party sees it.

        The sender's name is shown to the landlord because they are being asked to
        reply to a person. Nobody's **contact details** appear, in either
        direction.
      properties:
        id:
          type: integer
          readOnly: true
        unit:
          type: integer
          readOnly: true
        unit_label:
          type: string
          readOnly: true
        property_name:
          type: string
          readOnly: true
        property_slug:
          type: string
          readOnly: true
        sender_name:
          type: string
          readOnly: true
          description: '''Former student'' for an erased account (ADR-008).'
        message:
          type: string
          readOnly: true
        preferred_move_in_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/InquiryStatusEnum'
          readOnly: true
        response:
          type: string
          readOnly: true
        responded_by_name:
          type: string
          nullable: true
          readOnly: true
          description: Who replied -- the landlord or an assigned caretaker. Shown
            because the student is owed the knowledge that a person answered, and
            which.
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - preferred_move_in_date
      - property_name
      - property_slug
      - responded_at
      - responded_by_name
      - response
      - sender_name
      - status
      - unit
      - unit_label
    InquiryCreateRequest:
      type: object
      description: |-
        Sending one.

        An inquiry is an unsolicited message to a stranger, so the rate limit is
        part of the feature rather than a later hardening pass -- enforced here at
        the boundary AND in the service layer, which is what a management command
        or a future job would go through.
      properties:
        unit:
          type: integer
          description: Id of the unit you are asking about.
        message:
          type: string
          minLength: 1
          description: What you want to ask. **Do not include phone numbers, email
            addresses or messaging handles** -- they are rejected. Keeping the conversation
            here is what lets the platform confirm a resulting stay without anyone
            having to prove it later (ADR-004 §1.1).
          maxLength: 2000
        preferred_move_in_date:
          type: string
          format: date
          nullable: true
          description: Optional. When you would want to move in.
      required:
      - message
      - unit
    InquiryResponseRequest:
      type: object
      description: |-
        The landlord's or caretaker's reply.

        Same contact-details rule, in the other direction. A landlord answering
        "call me on 07..." is the same leak with the same consequence.
      properties:
        response:
          type: string
          minLength: 1
          description: Your reply. **Do not include phone numbers, email addresses
            or messaging handles** -- they are rejected in this direction too. Invite
            them to apply instead; that is the path the platform can witness.
          maxLength: 2000
      required:
      - response
    InquiryStatusEnum:
      enum:
      - sent
      - answered
      - closed
      - expired
      type: string
      description: |-
        * `sent` - Sent
        * `answered` - Answered
        * `closed` - Closed
        * `expired` - Expired unanswered
    LandlordRating:
      type: object
      description: |-
        A landlord's record across every property they own.

        The cold-start signal (ADR-004): a property with no reviews of its own can
        show this, **explicitly labelled as being about the landlord**, never about
        this property.
      properties:
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Mean rating, 1.00-5.00. **null means 'no verified reviews yet'
            and must render as those words.** Never 0, never an empty star row, never
            a placeholder. On a trust platform a fabricated signal is worse than no
            signal, because it is indistinguishable from a real one.
        student_count:
          type: integer
          readOnly: true
          description: 'Distinct students who contributed. **This is the public denominator:
            render it as ''from N students''.** It is deliberately smaller than review_count
            whenever anyone reviewed more than one stay in the same property -- that
            divergence IS the de-duplication, not a bug.'
        review_count:
          type: integer
          readOnly: true
          description: Number of review rows behind the average. **Not the public
            denominator** -- use student_count for that. A student who moved from
            a bedsitter to a one-bedroom in the same block writes two genuine reviews
            and counts as one voice, so these two numbers are SUPPOSED to differ.
        rating_distribution:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
          description: Counts by star, 1-5, every bucket present. Describes RAW reviews,
            not de-duplicated students -- 'how the scores fall' and 'how many people
            spoke' are different questions and both get an honest answer.
        last_review_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        computed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this cache was last rebuilt. Aggregates are stale by design
            between a review landing and the job running; a reconciler finds drift
            rather than the number being recomputed per request. **Null until anything
            has been computed** -- the same moment average_rating is null.
        property_count:
          type: integer
          readOnly: true
          description: 'How many of this landlord''s properties the figure spans.
            Show it alongside the average: ''4.2 across one property'' and ''4.2 across
            nine'' are different claims.'
      required:
      - average_rating
      - computed_at
      - last_review_at
      - property_count
      - rating_distribution
      - review_count
      - student_count
    Message:
      type: object
      description: A bare confirmation. The message is for a human, not for a branch.
      properties:
        message:
          type: string
          readOnly: true
      required:

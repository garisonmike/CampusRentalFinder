openapi: 3.0.3
info:
  title: CampusRentalFinder API
  version: 1.0.0
  description: API for the multi-university student rental platform.
paths:
  /api/v1/auth/admin/statistics/:
    get:
      operationId: auth_admin_statistics_retrieve
      description: Counts by capability rather than by a self-declared string.
      summary: User statistics
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      description: User administration for platform staff.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: auth_admin_users_create
      description: User administration for platform staff.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/auth/admin/users/{id}/:
    get:
      operationId: auth_admin_users_retrieve
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: auth_admin_users_update
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      description: User administration for platform staff.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/admin/users/{id}/toggle_active/:
    post:
      operationId: auth_admin_users_toggle_active_create
      description: User administration for platform staff.
      summary: Toggle active
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this User.
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/admin/verify/{user_id}/:
    post:
      operationId: auth_admin_verify_create
      description: |-
        Mark a landlord profile verified.

        Landlord verification is a platform-staff action. Student verification is
        a different flow entirely, run per-university (ADR-003).
      summary: Verify a landlord
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '404':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token.
      summary: Log out
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Identity and the caller's capability set (ADR-003).
      summary: Current user
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      summary: Change password
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: The caller's own identity.
      summary: Get profile
      tags:
      - User Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_profile_update
      description: |-
        PUT is supported as well as PATCH.

        The previous frontend called PUT here and got a 405 on every profile
        save, because the draft implemented only GET and PATCH
        (docs/AUDIT.md §5).
      summary: Replace profile
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: The caller's own identity.
      summary: Update profile
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account and return tokens.
      summary: Register
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/tenant/config/:
    get:
      operationId: tenant_config_retrieve
      description: 'Branding and identity for the university serving this host. Unauthenticated:
        the login page itself has to be branded, and it renders before any token exists.
        Returns 404 on a host that resolves no tenant, so the client falls back to
        its neutral palette.'
      summary: Tenant configuration
      tags:
      - Tenant
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'
          description: ''
        '404':
          description: No response body
  /health/live/:
    get:
      operationId: health_live_retrieve
      description: Returns 200 whenever the process can serve a request.
      summary: Liveness probe
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Returns 200 when the database and Redis are both reachable, 503
        otherwise.
      summary: Readiness probe
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    AdminUser:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
        is_staff:
          type: boolean
          readOnly: true
          title: Platform staff
          description: The only meaning of 'platform administrator'. Not settable
            via the API.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        capabilities:
          type: object
          description: |-
            The shape ``/auth/me/`` returns.

            Explicit rather than derived client-side, so the client never has to know
            what a LandlordProfile is.
          properties:
            is_student:
              type: boolean
            is_landlord:
              type: boolean
            is_university_staff:
              type: boolean
            is_staff:
              type: boolean
            is_verified_student:
              type: boolean
            verification_status:
              type: string
              nullable: true
            grace_period_ends_at:
              type: string
              nullable: true
            university:
              type: string
              nullable: true
            manages_properties:
              type: array
              items:
                type: integer
          required:
          - grace_period_ends_at
          - is_landlord
          - is_staff
          - is_student
          - is_university_staff
          - is_verified_student
          - manages_properties
          - university
          - verification_status
          readOnly: true
      required:
      - capabilities
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_staff
      - last_name
    AdminUserRequest:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
      required:
      - first_name
      - last_name
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
      - new_password_confirm
    PatchedAdminUserRequest:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
    PatchedUserUpdateRequest:
      type: object
      description: |-
        The fields a user may change about themselves.

        Deliberately short. Nothing here grants any capability: that is the point
        of ADR-003, and a registration or profile payload must never be able to
        escalate.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        avatar_url:
          type: string
          format: uri
          maxLength: 200
    TenantConfig:
      type: object
      description: |-
        The public tenant configuration (ADR-005).

        Deliberately small. It is fetched before first paint on every cold visit,
        so anything not needed to render the shell does not belong here.
      properties:
        subdomain:
          type: string
          readOnly: true
          description: 'The tenant host label: "kyu" serves kyu.example.co.ke.'
        name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
          description: Short form used in the interface, e.g. "KyU".
        logo_url:
          type: string
          format: uri
          readOnly: true
        favicon_url:
          type: string
          format: uri
          readOnly: true
        theme:
          allOf:
          - $ref: '#/components/schemas/TenantTheme'
          readOnly: true
      required:
      - display_name
      - favicon_url
      - logo_url
      - name
      - subdomain
      - theme
    TenantTheme:
      type: object
      description: |-
        The three tokens ADR-005 overrides.

        Foregrounds, `--ring` and the light/dark primary variants are derived
        client-side by WCAG contrast rather than sent, so a tenant cannot configure
        an unreadable button.
      properties:
        primary:
          type: string
          description: HSL triple, e.g. "142 71% 45%".
        secondary:
          type: string
        accent:
          type: string
      required:
      - accent
      - primary
      - secondary
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      description: A user's own identity, with their capability set.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        phone_verified:
          type: boolean
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        avatar_url:
          type: string
          format: uri
          maxLength: 200
        is_active:
          type: boolean
          readOnly: true
          title: Active
        date_joined:
          type: string
          format: date-time
          readOnly: true
        capabilities:
          type: object
          description: |-
            The shape ``/auth/me/`` returns.

            Explicit rather than derived client-side, so the client never has to know
            what a LandlordProfile is.
          properties:
            is_student:
              type: boolean
            is_landlord:
              type: boolean
            is_university_staff:
              type: boolean
            is_staff:
              type: boolean
            is_verified_student:
              type: boolean
            verification_status:
              type: string
              nullable: true
            grace_period_ends_at:
              type: string
              nullable: true
            university:
              type: string
              nullable: true
            manages_properties:
              type: array
              items:
                type: integer
          required:
          - grace_period_ends_at
          - is_landlord
          - is_staff
          - is_student
          - is_university_staff
          - is_verified_student
          - manages_properties
          - university
          - verification_status
          readOnly: true
      required:
      - capabilities
      - date_joined
      - email
      - email_verified
      - first_name
      - full_name
      - id
      - is_active
      - last_name
      - phone_verified
    UserLoginRequest:
      type: object
      description: Exchange credentials for a user.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    UserRegistrationRequest:
      type: object
      description: |-
        Create an account.

        No role field. The draft accepted ``user_type`` straight from the request
        body and never validated it, so anyone could register as an administrator
        and the object-permission checks trusted it (docs/AUDIT.md §4.4).

        When the request resolves a tenant, the new user gets a StudentProfile for
        that university — signing up on a university's own subdomain is the
        statement that you are its student. Landlord and staff profiles are granted,
        never self-declared.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
      required:
      - email
      - first_name
      - last_name
      - password
      - password_confirm
    UserUpdateRequest:
      type: object
      description: |-
        The fields a user may change about themselves.

        Deliberately short. Nothing here grants any capability: that is the point
        of ADR-003, and a registration or profile payload must never be able to
        escalate.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        avatar_url:
          type: string
          format: uri
          maxLength: 200
      required:
      - first_name
      - last_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

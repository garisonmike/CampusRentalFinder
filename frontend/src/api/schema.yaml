      - new_password
      - new_password_confirm
    PatchedAdminUserRequest:
      type: object
      description: |-
        User administration, for platform staff.

        ``is_staff`` stays read-only here too: elevating a user to platform staff
        is a Django admin or management-command action, never an API one.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        is_active:
          type: boolean
          title: Active
    PatchedAvailabilityRequest:
      type: object
      description: When a unit is free from, and whether it is listed at all.
      properties:
        available_from:
          type: string
          format: date
          nullable: true
          description: Null means no date given, which is not the same as available
            today.
        is_active:
          type: boolean
          description: False hides the unit from listings without deleting it. Use
            this rather than deleting a unit somebody has stayed in -- the tenancy
            records point at it.
    PatchedPropertyWriteRequest:
      type: object
      description: |-
        Creating and editing a property's own details.

        `status`, `published_at`, `slug` and `landlord` are all absent. Status
        moves through `publish()` and `unpublish()` because publishing has a gate;
        the slug is derived from the name and frozen once published, since a
        published URL is in somebody's saved list; and the landlord is the caller.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        county:
          $ref: '#/components/schemas/CountyEnum'
        town:
          type: string
          minLength: 1
          maxLength: 100
        estate:
          type: string
          minLength: 1
          description: e.g. "Kahawa Wendani"
          maxLength: 100
        street:
          type: string
          maxLength: 200
        landmark:
          type: string
          description: e.g. "opposite Naivas"
          maxLength: 200
        postal_address:
          type: string
          description: P.O. Box 43844-00100
          maxLength: 50
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
          description: 'Decimal degrees. **Required before publishing**: the campus
            join is computed from coordinates, and a property with none is invisible
            to every university (ADR-002). Saving without them is fine -- the draft
            simply cannot go live yet.'
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
          description: Decimal degrees. See `latitude`.
        has_water_tank:
          type: boolean
          title: Water tank
        has_borehole:
          type: boolean
          title: Borehole
        has_backup_power:
          type: boolean
          title: Backup power
        has_perimeter_wall:
          type: boolean
          title: Perimeter wall
        has_security_guard:
          type: boolean
          title: Security guard
        has_cctv:
          type: boolean
          title: CCTV
        has_wifi:
          type: boolean
          title: Wifi
        has_parking:
          type: boolean
          title: Parking
        caretaker_on_site:
          type: boolean
    PatchedReviewWriteRequest:
      type: object
      description: |-
        Creating or editing a review.

        ``tenancy`` is write-only and validated against the caller: a review is
        only ever about the caller's own stay, and accepting an arbitrary tenancy
        id would let anyone review anyone's.
      properties:
        tenancy:
          type: integer
          writeOnly: true
          description: The stay being reviewed. Must be one of your own, at least
            REVIEW_MINIMUM_STAY_DAYS long, and not already reviewed (ADR-004).
        rating:
          type: integer
          maximum: 5
          minimum: 1
          title: Overall rating
        cleanliness_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Cleanliness
        security_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Security
        water_reliability_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Water reliability
        landlord_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Landlord
        value_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
          title: Value for money
        comment:
          type: string
          maxLength: 2000
        would_recommend:
          type: boolean
          nullable: true
    PatchedUnitWriteRequest:
      type: object
      description: |-
        Creating and editing a unit.

        `vacant_count` is **not here and will not be added.** It is stated through
        `PATCH .../vacancy/`, which stamps the time and the author with it. A unit
        edit that could also set the count would let a fresh number keep an old
        date, which is worse than a stale count because the staleness signal would
        then claim currency.

        `available_from` and `is_active` are not here either, for a different
        reason: they are separately delegable. A caretaker may be trusted to say a
        room is off the market without being trusted to change its rent.
      properties:
        label:
          type: string
          minLength: 1
          description: '"B12" for one unit, or "Bedsitters" for a pool of identical
            ones.'
          maxLength: 50
        unit_type:
          $ref: '#/components/schemas/UnitTypeEnum'
        rent_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Monthly rent (KES)
        deposit_kes:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Deposit (KES)
        water_included:
          type: boolean
        electricity_included:
          type: boolean
          description: Token metering is the norm otherwise.
        wifi_included:
          type: boolean
        furnished:
          allOf:
          - $ref: '#/components/schemas/FurnishedEnum'
          title: Furnishing
        size_sqm:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Size (m²)
          description: Square metres, not feet.
        bedrooms:
          type: integer
          maximum: 32767
          minimum: 0
          description: 0 for a bedsitter or single room.
        has_private_bathroom:
          type: boolean
          title: Private bathroom
          description: Replaces the draft's bathrooms>=1, which made a hostel block
            with shared ablutions impossible to list.
        has_kitchenette:
          type: boolean
          title: Kitchenette
        floor:
          type: integer
          maximum: 32767
          minimum: -32768
          nullable: true
        total_count:
          type: integer
          maximum: 32767
          minimum: 0
          title: Total units
          description: How many identical rooms this row represents. A hostel block
            is one Unit with a total_count of forty, not forty Units.
        min_stay_months:
          type: integer
          maximum: 32767
          minimum: 0
          title: Minimum stay (months)
          description: One semester. The draft defaulted to a 12-month lease.
    PatchedUniversityPolicyRequest:
      type: object
      description: The settings a school administers about itself.
      properties:
        display_name:
          type: string
          minLength: 1
          description: Short form used in the interface, e.g. "KyU".
          maxLength: 50
        signup_policy:
          allOf:
          - $ref: '#/components/schemas/SignupPolicyEnum'
          description: |-
            `open` (verification not mentioned at signup), `verification_encouraged` (prompted, can skip), or `verification_required`.

            **Cannot be set to `verification_required` until at least one student here is verified.** A school that sets it before issuing student addresses locks out an entire intake in the week they most need the platform.

            Raising this affects NEW signups only. Existing students keep what they had -- gating reads the policy frozen at each student's own registration (ADR-003).

            * `open` - Open — verification is not mentioned at signup
            * `verification_encouraged` - Encouraged — the student is prompted and can skip
            * `verification_required` - Required — signup completes only for a verified student
        verification_methods_enabled:
          type: array
          items:
            $ref: '#/components/schemas/VerificationMethodsEnabledEnum'
          description: 'Which paths this school offers. Empty means none, which is
            the default. A school with no document reviewers should not enable `student_id_upload`:
            uploads would arrive into a queue nobody works, and since the retention
            clock starts at upload that means collecting national IDs purely to delete
            them thirty days later.'
        student_email_domains:
          type: array
          items:
            type: string
            maxLength: 255
          description: Domains that prove enrolment, e.g. `["s.kyu.ac.ke"]`. Matched
            EXACTLY on the full domain -- list every subdomain you want accepted,
            because `alumni.kyu.ac.ke` is not `kyu.ac.ke` and the platform will not
            infer enrolment from DNS hierarchy. Blank entries are dropped; whitespace
            and case are normalised.
        verification_grace_period_days:
          type: integer
          maximum: 180
          minimum: 1
          title: Verification grace period (days)
          description: How long a new student may use gated actions before verifying.
            Verification waits on a registry or a human reviewer, neither of which
            the student controls.
        verification_required_to_review:
          type: boolean
        verification_enforced_from:
          type: string
          format: date
          nullable: true
          description: Announce a change before it bites. Until this date the policy
            is treated as `open` for new signups.
        primary_hsl:
          type: string
          minLength: 1
          title: Primary colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
        secondary_hsl:
          type: string
          minLength: 1
          title: Secondary colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
        accent_hsl:
          type: string
          minLength: 1
          title: Accent colour
          pattern: ^\d{1,3}(\.\d+)?\s+\d{1,3}(\.\d+)?%\s+\d{1,3}(\.\d+)?%$
          maxLength: 32
    PatchedUserUpdateRequest:
      type: object
      description: |-
        The fields a user may change about themselves.

        Deliberately short. Nothing here grants any capability: that is the point
        of ADR-003, and a registration or profile payload must never be able to
        escalate.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+254[17]\d{8}$
          maxLength: 13
        avatar_url:
          type: string
          format: uri
          maxLength: 200
    PatchedVacancyRequest:
      type: object
      description: |-
        Stating how many rooms are free.

        One field, its own endpoint, and its own delegable permission -- because
        this is the number a student crosses a city on. Every write through it is
        stamped with who said it and when, and that stamp is what the listing
        shows beside the count.
      properties:
        vacant_count:
          type: integer
          minimum: 0
          description: 'How many rooms are free right now, as you know it. Never derived
            from our tenancy records: you know about the room let off-platform last
            week and we do not. Must not exceed the unit''s total_count.'
    Photo:
